<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validador Expediciones V4.1</title><script src="https://unpkg.com/html5-qrcode"></script><style>body{font-family:Arial;background:#f3f4f6;margin:0;padding:10px;text-align:center}.card{max-width:800px;margin:auto;background:#fff;padding:15px;border-radius:16px}#reader{max-width:500px;margin:auto}.okfull,.kofull{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold;z-index:9999}.okfull{background:#16a34a;color:#fff}.kofull{background:#dc2626;color:#fff}input{width:95%;padding:10px;margin:5px}button{padding:12px 18px;margin:5px;background:#0078d4;color:#fff;border:none;border-radius:8px}#historial{max-height:300px;overflow:auto;text-align:left}.item{border-bottom:1px solid #ddd;padding:8px}.item img{max-width:80px;border-radius:6px}</style></head><body><div class="card"><h2>Validador Expediciones V4.1</h2><div id="paso">Pulse Iniciar Cámara</div><div id="reader"></div><input id="c1" readonly placeholder="Código 1"><input id="c2" readonly placeholder="Código 2"><button onclick="iniciarCamara()">Iniciar cámara</button><button onclick="nuevaValidacion()">Nueva validación</button><h3>Historial últimos 30 días</h3><div id="historial"></div></div><script>let qrScanner,codigo1='',codigo2='',bloqueo=false;let ultimoFrame='';const DIAS=30;function limpiarAntiguos(h){const limite=Date.now()-(DIAS*24*60*60*1000);return h.filter(x=>new Date(x.fechaISO).getTime()>=limite);}function cargarHist(){let h=JSON.parse(localStorage.getItem('historialV41')||'[]');h=limpiarAntiguos(h);localStorage.setItem('historialV41',JSON.stringify(h));let d=document.getElementById('historial');d.innerHTML=h.map(x=>`<div class=item><b>${x.fecha}</b> ${x.resultado}<br>${x.c1}<br>${x.c2}<br><img src='${x.img}'></div>`).join('');}function guardar(resultado){let h=JSON.parse(localStorage.getItem('historialV41')||'[]');h=limpiarAntiguos(h);h.unshift({fecha:new Date().toLocaleString(),fechaISO:new Date().toISOString(),resultado,c1:codigo1,c2:codigo2,img:ultimoFrame});localStorage.setItem('historialV41',JSON.stringify(h));cargarHist();}function mostrar(ok){let div=document.createElement('div');div.className=ok?'okfull':'kofull';div.innerHTML=ok?'✅ COINCIDEN':'❌ NO COINCIDEN';document.body.appendChild(div);guardar(ok?'OK':'ERROR');setTimeout(()=>{div.remove();nuevaValidacion();},3000);}function procesar(texto){if(bloqueo)return;bloqueo=true;if(!codigo1){codigo1=texto;c1.value=texto;paso.innerHTML='Escanee el segundo código';}else if(!codigo2){codigo2=texto;c2.value=texto;mostrar(codigo1===codigo2);}setTimeout(()=>bloqueo=false,1200);}function nuevaValidacion(){codigo1='';codigo2='';c1.value='';c2.value='';paso.innerHTML='Escanee el primer código';}function iniciarCamara(){if(qrScanner)return;qrScanner=new Html5Qrcode('reader');qrScanner.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{try{let v=document.querySelector('video');if(v){let c=document.createElement('canvas');c.width=v.videoWidth||320;c.height=v.videoHeight||240;c.getContext('2d').drawImage(v,0,0,c.width,c.height);ultimoFrame=c.toDataURL('image/jpeg',0.5);}}catch(e){}procesar(txt);});}cargarHist();</script></body></html>
